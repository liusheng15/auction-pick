name: Run Auction Pick

on:
  schedule:
    - cron: '0 10 * * *'  # 定时运行（UTC时间10点，即北京时间18点）
  workflow_dispatch:      # 允许在网页上手动点击运行测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install tushare requests

      - name: Run script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
